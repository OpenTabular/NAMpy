repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: ruff check
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: mypy nampy/
        language: system
        pass_filenames: false
        types: [python]

      - id: repository-hygiene
        name: Repository hygiene
        entry: python scripts/check_repository_hygiene.py
        language: system
        pass_filenames: false
        files: (^|/)(.*\.(py|toml|ya?ml|rst|md)|Makefile)$
