name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  verify:
    name: Verify release artifacts
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install verification dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all,dev]"
        pip install build twine

    - name: Run release gates
      run: |
        ruff check nampy tests examples
        mypy nampy
        python tests/repository_hygiene.py
        pytest tests/neural/test_neural_sklearn_contracts.py::test_public_packages_export_supported_neural_surfaces tests/diagnostics/test_gam_plot_and_public_api_contracts.py::test_public_gam_package_exports_contract -v

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Smoke-test installed wheel
      run: |
        python -m pip install --no-deps --force-reinstall dist/*.whl
        cd "${RUNNER_TEMP}"
        python "${GITHUB_WORKSPACE}/tests/public_api/installed_package_smoke.py"

    - name: Upload release artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
    - name: Download release artifacts
      uses: actions/download-artifact@v4
      with:
        name: release-dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
