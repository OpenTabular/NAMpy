name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: "4.5.3"
        use-public-rspm: true

    - name: Install R test dependencies
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: any::jsonlite

    - name: Install vendored mgcv
      run: R CMD INSTALL ./mgcv

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all,dev]"

    - name: Run tests
      env:
        MGCV_CACHE_ONLY: "0"
      run: |
        pytest tests/ --cov=nampy --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  portability:
    name: Numerical portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      MGCV_CACHE_ONLY: "0"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: "4.5.3"
        use-public-rspm: true

    - name: Install R test dependencies
      uses: r-lib/actions/setup-r-dependencies@v2
      with:
        packages: any::jsonlite

    - name: Install vendored mgcv
      run: R CMD INSTALL ./mgcv

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all,dev]"

    - name: Run portable numerical slices
      run: >-
        pytest
        tests/regressions/test_no_platform_numeric_bindings.py
        tests/optimization/test_gam_linalg_exports.py
        tests/optimization/test_mgcv_gam_side_parity.py::test_gam_side_penalty_root_is_checked_through_its_identified_gram_matrix
        tests/parity/test_gam_parity_invariants.py
        tests/smooths/test_mgcv_nat_param_parity.py
        tests/regressions/test_chi_square_mixtures_mgcv_parity.py
        -v

    - name: Run portable spline-constructor slices
      run: >-
        pytest
        'tests/smooths/test_mgcv_raw_constructor_parity.py::test_raw_constructor_matches_mgcv[cr_k8]'
        'tests/smooths/test_mgcv_raw_constructor_parity.py::test_raw_constructor_matches_mgcv[cs_k8]'
        'tests/smooths/test_mgcv_raw_constructor_parity.py::test_raw_constructor_matches_mgcv[tp_max_knots_xt]'
        'tests/smooths/test_mgcv_raw_constructor_parity.py::test_raw_constructor_matches_mgcv[fs_default_tp]'
        'tests/smooths/test_mgcv_raw_constructor_parity.py::test_raw_constructor_matches_mgcv[ti_mc_true_false]'
        'tests/smooths/test_mgcv_ti_stage_parity.py::test_ti_shrinkage_penalty_invariants_match_mgcv_raw_constructor'
        -v

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all,dev]"

    - name: Lint with Ruff
      run: |
        ruff check nampy tests scripts

    - name: Check repository hygiene
      run: python scripts/check_repository_hygiene.py

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[all,dev]"

    - name: Type check with mypy
      run: mypy nampy/

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [test, portability, lint, type-check]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Smoke-test installed wheel
      run: |
        wheel_paths=(dist/*.whl)
        python -m pip install --no-cache-dir "${wheel_paths[0]}[all]"
        cd "${RUNNER_TEMP}"
        python "${GITHUB_WORKSPACE}/scripts/check_installed_package.py"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
