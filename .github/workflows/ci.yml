name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  # These small numerical problems run concurrently across CI jobs; avoid
  # oversubscribing each runner with BLAS/OpenMP worker pools.
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -c .github/constraints-ci.txt -r .github/requirements-ci-cpu-torch.txt
        pip install -c .github/constraints-ci.txt -e ".[dev]"

    - name: Run tests from static upstream fixtures
      run: |
        pytest tests/ --cov=nampy --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  portability:
    name: Numerical portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -c .github/constraints-ci.txt -e ".[dev]"

    - name: Run portable numerical slices
      run: >-
        pytest
        tests/regressions/test_no_platform_numeric_bindings.py
        tests/regressions/test_fixture_checkout_integrity.py
        tests/optimization/test_gam_linalg_exports.py
        tests/optimization/test_mgcv_gam_side_parity.py::test_gam_side_penalty_root_is_checked_through_its_identified_gram_matrix
        tests/parity/test_gam_parity_invariants.py
        tests/smooths/test_mgcv_nat_param_parity.py
        tests/regressions/test_chi_square_mixtures_mgcv_parity.py
        -v

    - name: Run portable quasi-family slices
      run: >-
        pytest
        tests/families/test_quasi_family_contracts.py
        tests/families/test_mgcv_quasi_workflows.py
        tests/docs/test_quasi_example.py
        -v

    - name: Run portable SCAT-family slices
      run: >-
        pytest
        tests/families/test_scat_family_contracts.py
        tests/families/test_mgcv_scat_workflows.py
        tests/families/test_mgcv_scat_optimizers.py
        tests/families/test_scat_postfit_reference_state.py
        tests/families/test_scat_rank_uncertainty_source_contract.py
        tests/families/test_scat_outer_controls.py
        tests/families/test_scat_public_guards.py
        tests/diagnostics/test_scat_residuals.py
        tests/parity/test_gam_seven_stage_pipeline_contracts.py
        tests/docs/test_scat_example.py
        -v

    - name: Run portable ziP-family slices
      run: >-
        pytest
        tests/families/test_source_scalar_math.py
        tests/families/test_zip_family_contracts.py
        tests/families/test_mgcv_zip_workflows.py
        tests/families/test_mgcv_zip_optimizers.py
        tests/families/test_zip_public_contracts.py
        tests/docs/test_zip_example.py
        -v

    - name: Run portable censored-normal slices
      run: >-
        pytest
        tests/families/test_cnorm_family_contracts.py
        tests/families/test_mgcv_cnorm_workflows.py
        tests/families/test_mgcv_cnorm_optimizers.py
        tests/families/test_censored_response_contracts.py
        tests/families/test_cnorm_public_contracts.py
        tests/docs/test_cnorm_example.py
        -v

    - name: Run portable censored-logistic slices
      run: >-
        pytest
        tests/families/test_clog_family_contracts.py
        tests/families/test_clog_acceptance.py
        tests/families/test_mgcv_clog_workflows.py
        tests/families/test_clog_public_contracts.py
        tests/docs/test_clog_example.py
        -v

    - name: Run portable remaining-family slices
      run: >-
        pytest
        tests/families/test_cpois_family_contracts.py
        tests/families/test_cpois_tail_derivative_precision.py
        tests/families/test_mgcv_cpois_workflows.py
        tests/families/test_bcg_family_contracts.py
        tests/families/test_mgcv_bcg_workflows.py
        tests/families/test_mgcv_gumbls_workflows.py
        tests/families/test_mgcv_ziplss_workflows.py
        tests/families/test_multinom_family_contracts.py
        tests/families/test_mgcv_multinom_workflows.py
        tests/families/test_gevlss_family_contracts.py
        tests/families/test_mgcv_gevlss_workflows.py
        tests/families/test_shash_family_contracts.py
        tests/families/test_twlss_family_contracts.py
        tests/families/test_twlss_null_fit_contracts.py
        tests/families/test_twlss_persistence_contracts.py
        tests/families/test_general_efs_initialization_invariants.py
        tests/families/test_general_family_mgcv_parity.py::test_general_family_newdata_unconditional_standard_errors_match_mgcv
        tests/optimization/test_mgcv_postprocessing_final_fit_parity.py::test_gam_fit5_select_true_postprocessing_at_mgcv_endpoint_matches_mgcv
        tests/parity/test_remaining_family_pipeline_contracts.py
        tests/public_api/test_remaining_gamlss_families.py
        tests/docs/test_cpois_example.py
        tests/docs/test_shash_twlss_examples.py
        tests/docs/test_remaining_family_examples.py
        -v

    - name: Run matrix-functional and soap tensor references
      run: >-
        pytest
        tests/smooths/test_mgcv_tp_linear_functionals.py
        tests/smooths/test_mgcv_single_penalty_functionals.py
        tests/smooths/test_mgcv_spline_linear_functionals.py
        tests/smooths/test_mgcv_matrix_cs_invariants.py
        tests/smooths/test_mgcv_ad_functionals.py
        tests/smooths/test_mgcv_categorical_functionals.py
        tests/smooths/test_mgcv_functional_packing.py
        tests/smooths/test_mgcv_fs_functional.py
        tests/smooths/test_mgcv_fs_tp_functional.py
        tests/smooths/test_mgcv_sz_functional.py
        tests/smooths/test_mgcv_soap_functional.py
        tests/smooths/test_mgcv_soap_repeated_functional.py
        tests/smooths/test_mgcv_tensor_linear_functionals.py
        tests/smooths/test_t2_bs_functional_invariants.py
        tests/optimization/test_mgcv_weighted_gaussian_criterion.py
        tests/smooths/test_mgcv_soap_tensor.py
        tests/smooths/test_mgcv_soap_tensor_compositions.py
        tests/smooths/test_mgcv_re_tensor.py
        tests/smooths/test_mgcv_re_tensor_numeric_labels.py
        tests/smooths/test_mgcv_soap_factor.py
        tests/smooths/test_mgcv_soap_factor_classification.py
        tests/smooths/test_mgcv_soap_matrix_factor.py
        tests/docs/test_matrix_functional_example.py
        tests/docs/test_soap_compositions_example.py
        tests/parity/test_gam_seven_stage_pipeline_contracts.py::test_soap_compositions_cover_seven_stage_pipeline
        tests/parity/test_mgcv_bs_constraints.py
        tests/docs/test_bs_constraints_example.py
        tests/parity/test_gam_seven_stage_pipeline_contracts.py::test_explicit_bs_constraints_cover_seven_stage_pipeline
        tests/smooths/test_mgcv_explicit_matrix_factor.py
        tests/docs/test_matrix_factor_example.py
        tests/parity/test_gam_seven_stage_pipeline_contracts.py::test_explicit_matrix_factors_cover_seven_stage_pipeline
        tests/parity/test_mgcv_parametric_penalty_maps.py
        tests/parity/test_parametric_map_vcomp.py
        tests/docs/test_parametric_penalty_map_example.py
        tests/parity/test_gam_seven_stage_pipeline_contracts.py::test_parametric_log_sp_maps_cover_seven_stage_pipeline
        -q

    - name: Run portable spline-constructor slices
      run: >-
        pytest
        'tests/smooths/test_mgcv_raw_constructor_parity.py::test_raw_constructor_matches_mgcv[cr_k8]'
        'tests/smooths/test_mgcv_raw_constructor_parity.py::test_raw_constructor_matches_mgcv[cs_k8]'
        'tests/smooths/test_mgcv_raw_constructor_parity.py::test_raw_constructor_matches_mgcv[tp_max_knots_xt]'
        'tests/smooths/test_mgcv_raw_constructor_parity.py::test_raw_constructor_matches_mgcv[fs_default_tp]'
        'tests/smooths/test_mgcv_raw_constructor_parity.py::test_raw_constructor_matches_mgcv[ti_mc_true_false]'
        'tests/smooths/test_mgcv_ti_stage_parity.py::test_ti_shrinkage_penalty_invariants_match_mgcv_raw_constructor'
        -v

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -c .github/constraints-ci.txt -e ".[dev]"

    - name: Lint with Ruff
      run: |
        ruff check nampy tests examples

    - name: Check repository hygiene
      run: python tests/repository_hygiene.py

  type-check:
    name: Type Check Stable Contracts
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -c .github/constraints-ci.txt -e ".[dev]"

    - name: Type check stable public contracts with mypy
      # The package-wide annotation backlog is tracked separately. Keep this
      # gate honest by checking the stable typed boundary without recursively
      # importing modules that have not yet adopted the contract.
      run: >-
        mypy --follow-imports=skip
        nampy/contracts.py
        nampy/neural/contracts.py
        nampy/gam/fit/state.py

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [test, portability, lint, type-check]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Smoke-test installed wheel
      run: |
        wheel_paths=(dist/*.whl)
        python -m pip install -c .github/constraints-ci.txt -r .github/requirements-ci-cpu-torch.txt
        python -m pip install --no-cache-dir -c .github/constraints-ci.txt "${wheel_paths[0]}"
        cd "${RUNNER_TEMP}"
        python "${GITHUB_WORKSPACE}/tests/public_api/installed_package_smoke.py"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
