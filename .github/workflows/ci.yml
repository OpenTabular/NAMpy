name: CI

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run tests
      run: |
        export MGCV_CACHE_ONLY=1
        pytest tests/ --cov=nampy --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  portability:
    name: Numerical portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      MGCV_CACHE_ONLY: "1"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run portable numerical slices
      run: >-
        pytest
        tests/regressions/test_no_platform_numeric_bindings.py
        tests/optimization/test_gam_linalg_exports.py
        tests/parity/test_gam_parity_invariants.py
        tests/smooths/test_mgcv_nat_param_parity.py
        tests/regressions/test_chi_square_mixtures_mgcv_parity.py
        -v

    - name: Run portable spline-constructor slices
      run: >-
        pytest
        'tests/smooths/test_mgcv_raw_constructor_parity.py::test_raw_constructor_matches_mgcv[cr_k8]'
        'tests/smooths/test_mgcv_raw_constructor_parity.py::test_raw_constructor_matches_mgcv[cs_k8]'
        'tests/smooths/test_mgcv_raw_constructor_parity.py::test_raw_constructor_matches_mgcv[tp_max_knots_xt]'
        'tests/smooths/test_mgcv_raw_constructor_parity.py::test_raw_constructor_matches_mgcv[fs_default_tp]'
        'tests/smooths/test_mgcv_raw_constructor_parity.py::test_raw_constructor_matches_mgcv[ti_mc_true_false]'
        -v

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black ruff isort

    - name: Check formatting with Black
      run: |
        black --check nampy/ tests/

    - name: Check import sorting with isort
      run: |
        isort --check-only --profile black nampy/ tests/

    - name: Lint with Ruff
      run: |
        ruff check nampy/ tests/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Type check with mypy
      run: |
        mypy nampy/ || true  # Don't fail on type errors for now

  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: [test, portability, lint]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: python -m build

    - name: Check package
      run: twine check dist/*

    - name: Smoke-test installed wheel
      run: |
        python -m pip install --no-cache-dir dist/*.whl
        cd "${RUNNER_TEMP}"
        python -c "import pathlib, nampy, pretab; import nampy.gam as gam; from nampy.models.linreg import LinRegRegressor; package_path = pathlib.Path(nampy.__file__).resolve(); assert 'site-packages' in package_path.parts, package_path; assert gam.__all__ == ['fit_model_core', 'solve_fit', 'FitCoreSolution']; assert not hasattr(nampy, 'GAM'); LinRegRegressor(); print(package_path); print(pretab.__version__)"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
