name: Documentation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: write
  pages: write

jobs:
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pandoc

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[docs]"

    - name: Generate Sphinx autodoc HTML
      env:
        MPLCONFIGDIR: /tmp/nampy-matplotlib
      run: |
        sphinx-build -b html -j auto docs docs/_build/html

    - name: Check for build warnings
      run: |
        # Fail if there are critical warnings (optional)
        # cat docs/_build/html/.buildinfo

    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v4
      with:
        name: docs-html
        path: docs/_build/html/

    - name: Deploy to GitHub Pages (main branch only)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html
        cname: nampy.readthedocs.io  # Optional: if you have a custom domain
