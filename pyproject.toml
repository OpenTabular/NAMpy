[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nampy"
dynamic = ["version"]
description = "Interpretable additive modeling with mgcv-aligned GAMs and neural models"
readme = "README.md"
license = "MIT"
authors = [
    {name = "Ananyapam De", email = "ananyapam7@tu-clausthal.de"},
    {name = "Anton Thielmann", email = "anton.thielmann@tu-clausthal.de"},
]
maintainers = [
    {name = "Ananyapam De", email = "ananyapam7@tu-clausthal.de"},
    {name = "Anton Thielmann", email = "anton.thielmann@tu-clausthal.de"},
]
keywords = [
    "machine learning",
    "deep learning",
    "neural networks",
    "tabular data",
    "interpretability",
    "neural additive models",
    "NAM",
    "generalized additive models",
    "GAM",
    "mgcv",
    "statistical smoothing",
    "explainable AI",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy<=1.26.4",
    "pandas",
    "scikit-learn",
    "joblib",
]

[project.optional-dependencies]
gam = [
    "scipy>=1.16",
    "matplotlib",
]
neural = [
    "scipy>=1.16",
    "matplotlib",
    "lightning",
    "torch",
    "torchmetrics",
    "properscoring",
    "pretab>=1.0.0rc2",
]
igann-sparse = [
    "abess>=0.4.5",
]
all = [
    "scipy>=1.16",
    "matplotlib",
    "lightning",
    "torch",
    "torchmetrics",
    "properscoring",
    "pretab>=1.0.0rc2",
    "abess>=0.4.5",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=22.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "isort>=5.0",
    "pre-commit>=3.0",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-autodoc-typehints>=1.0",
    "myst-parser>=2.0.0",
    "nbsphinx>=0.9.0",
    "ipykernel",
]

[project.urls]
Homepage = "https://github.com/OpenTabular/NAMpy"
Documentation = "https://github.com/OpenTabular/NAMpy"
Repository = "https://github.com/OpenTabular/NAMpy"
"Bug Tracker" = "https://github.com/OpenTabular/NAMpy/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "nampy.__version__.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["nampy*"]
exclude = ["tests*", "debug*", "docs*", "mgcv*", "upstreams*"]

[tool.black]
line-length = 88
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403", "F405"]
# Examples are standalone scripts, so sys.path setup may precede imports.
"examples/*" = ["E402", "B905"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = false
warn_redundant_casts = true
warn_unused_ignores = false
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "lightning.*",
    "torch.*",
    "sklearn.*",
    "pandas.*",
    "numpy.*",
    "matplotlib.*",
    "properscoring.*",
    "scipy.*",
    "tqdm.*",
    "pretab.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Collect every test module. Do not narrow this to name-prefix allowlists:
# a file that stops matching is skipped silently, and the suite-contract
# test's explicit-path collection would still certify it (see
# tests/regressions/test_gam_test_suite_contracts.py).
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
]
markers = [
    "smooth_cr: tests covering cubic regression smooths",
    "smooth_cs: tests covering shrinkage cubic regression smooths",
    "smooth_cc: tests covering cyclic cubic smooths",
    "smooth_ps: tests covering P-spline smooths",
    "smooth_tp: tests covering thin plate smooths",
    "smooth_ts: tests covering shrinkage thin plate smooths",
    "smooth_te: tests covering tensor-product smooths via te()",
    "smooth_ti: tests covering tensor interaction smooths via ti()",
    "smooth_fs: tests covering factor-smooth interaction smooths",
    "smooth_sz: tests covering sz factor smooths",
    "smooth_re: tests covering random-effect smooths",
    "family_gaussian: tests for Gaussian family behavior",
    "family_binomial: tests for binomial family behavior",
    "family_poisson: tests for Poisson family behavior",
    "family_gamma: tests for gamma family behavior",
    "family_negbin: tests for negative-binomial family behavior",
    "family_gaulss: tests for gaulss general family behavior",
    "family_gammals: tests for gammals general family behavior",
    "family_general: tests spanning multiple general/distributional families",
    "method_fixed: tests using fixed smoothing parameters",
    "method_reml: tests using REML smoothing selection",
    "method_ml: tests using ML smoothing selection",
    "method_laml: tests using LAML smoothing selection",
    "method_gcv: tests using GCV smoothing selection",
    "method_ubre: tests using UBRE smoothing selection",
    "link_identity: tests using an identity family link",
    "link_log: tests using a log family link",
    "link_inverse: tests using an inverse family link",
    "link_logit: tests using a logit family link",
    "link_probit: tests using a probit family link",
    "link_cloglog: tests using a complementary log-log family link",
    "link_cauchit: tests using a cauchit family link",
    "link_sqrt: tests using a square-root family link",
    "optimizer_newton: tests using outer Newton smoothing optimization",
    "optimizer_bfgs: tests using BFGS smoothing optimization",
    "optimizer_efs: tests using extended Fellner-Schall optimization",
    "optimizer_optim: tests using the optim-compatible route",
    "select_true: tests exercising select=True behavior",
    "select_false: tests exercising default/non-select behavior",
    "surface_snapshot: tests focused on snapshot/end-to-end parity surfaces",
    "surface_output: tests focused on prediction/anova/vcov/output surfaces",
    "surface_smoothcon: tests focused on smoothCon/basis/penalty surfaces",
    "surface_trace: tests focused on optimizer trace surfaces",
    "surface_kcheck: tests focused on k_check diagnostics",
    "surface_derivatives: tests focused on gradients/Hessians/criterion derivatives",
    "surface_regression: tests focused on explicit bug-regression coverage",
    "surface_backend: tests focused on backend-selection behavior",
    "status_stable: stable parity/regression coverage",
    "status_known_gap: tracked known-gap coverage",
    "status_failing_or_warning: tests currently isolated due to failures or warnings",
    "status_regression: bug-regression tests that guard past failures",
]

[tool.coverage.run]
source = ["nampy"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
