<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" role="img" aria-labelledby="title desc">
  <title id="title">NBM preprocessing and term labels</title>
  <desc id="desc">Source features are transformed into encoded scalar concepts, passed through shared neural bases, and reported using their resulting term labels.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#8a3552"/>
    </marker>
    <style>
      .box{fill:#fff7f9;stroke:#b4234d;stroke-width:2;rx:14}
      .title{font:600 18px Inter,Arial,sans-serif;fill:#2d2330}
      .body{font:14px Inter,Arial,sans-serif;fill:#514550}
      .arrow{stroke:#8a3552;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="box" x="20" y="35" width="190" height="130"/>
  <text class="title" x="115" y="70" text-anchor="middle">Source features</text>
  <text class="body" x="115" y="103" text-anchor="middle">temperature</text>
  <text class="body" x="115" y="130" text-anchor="middle">region</text>
  <path class="arrow" d="M215 100 H278"/>
  <rect class="box" x="285" y="20" width="220" height="160"/>
  <text class="title" x="395" y="56" text-anchor="middle">Preprocessing</text>
  <text class="body" x="395" y="91" text-anchor="middle">scaled temperature</text>
  <text class="body" x="395" y="118" text-anchor="middle">region_north</text>
  <text class="body" x="395" y="145" text-anchor="middle">region_south</text>
  <path class="arrow" d="M510 100 H573"/>
  <rect class="box" x="580" y="35" width="150" height="130"/>
  <text class="title" x="655" y="71" text-anchor="middle">Shared bases</text>
  <text class="body" x="655" y="105" text-anchor="middle">b₁(·), …, bᵣ(·)</text>
  <text class="body" x="655" y="133" text-anchor="middle">reused by terms</text>
  <path class="arrow" d="M735 100 H788"/>
  <rect class="box" x="795" y="35" width="105" height="130"/>
  <text class="title" x="847" y="70" text-anchor="middle">Terms</text>
  <text class="body" x="847" y="104" text-anchor="middle">inspect</text>
  <text class="body" x="847" y="130" text-anchor="middle">labels</text>
</svg>
