<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
<title id="title">Feature heads and a global attention branch</title><desc id="desc">Feature blocks feed separate feature-specific heads, or projections and attention with residual feed-forward layers that produce a global component. Outputs are added into the predictor.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#476580"/></marker></defs>
<g fill="#edf5fc" stroke="#7399bc" stroke-width="1.5"><rect x="10" y="100" width="140" height="70" rx="8"/><rect x="210" y="15" width="260" height="65" rx="8"/><rect x="210" y="160" width="150" height="65" rx="8"/><rect x="405" y="160" width="245" height="65" rx="8"/><rect x="700" y="160" width="140" height="65" rx="8"/><rect x="830" y="15" width="120" height="65" rx="8"/></g>
<g fill="none" stroke="#476580" stroke-width="2" marker-end="url(#arrow)"><path d="M150 115L185 48H210"/><path d="M150 150L185 192H210"/><path d="M360 192H405"/><path d="M650 192H700"/><path d="M470 48H830"/><path d="M840 192H890V80"/></g>
<g fill="#193d5b" font-family="sans-serif" font-size="17" text-anchor="middle"><text x="80" y="130">Feature blocks</text><text x="80" y="153">x, z, category</text><text x="340" y="42">Separate feature heads</text><text x="340" y="64">f(x), f(z), f(category)</text><text x="285" y="188">Per-block</text><text x="285" y="211">projections</text><text x="527" y="187">Attention + residual FFN</text><text x="527" y="210">mixes feature tokens</text><text x="770" y="187">Global head</text><text x="770" y="210">h(all inputs)</text><text x="890" y="43">Add into</text><text x="890" y="65">predictor η</text><text x="480" y="265" font-size="15">The attentive example uses the lower global branch. Feature contributions require the separate upper branch.</text></g></svg>