{% extends "!layout.html" %}

{% block menu %}
  {% set home_doc = root_doc|default(master_doc) %}
  {% set home_item %}
    <li class="toctree-l1 home-navigation{% if pagename == home_doc %} current{% endif %}">
      <a class="reference internal{% if pagename == home_doc %} current{% endif %}"
         href="{{ pathto(home_doc) }}"{% if pagename == home_doc %} aria-current="page"{% endif %}>Home</a>
    </li>
  {% endset %}
  {% set navigation = super() %}
  {{ navigation.replace('<li class="toctree-l1', home_item ~ '<li class="toctree-l1', 1)|safe }}
{% endblock %}

{% block content %}
  {{ super() }}
  <aside class="page-navigation" aria-label="On this page" hidden>
    <p class="page-navigation-title" id="page-navigation-title">On this page</p>
    <nav aria-labelledby="page-navigation-title"></nav>
  </aside>
{% endblock %}
