# Read the Docs configuration file for NAMpy.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

# Build documentation in the docs/ directory
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - pandoc
    - libcairo2
    - texlive-luatex
    - fonts-freefont-otf
    - xindy
  jobs:
    post_create_environment:
      - pip install --upgrade pip setuptools wheel
    build:
      pdf:
        # Keep converted figures and TeX intermediates out of the upload folder.
        - python -m sphinx -M latexpdf docs docs/_build/rtd-pdf -D language=en
        - mkdir -p "$READTHEDOCS_OUTPUT/pdf"
        - cp docs/_build/rtd-pdf/latex/NAMpy.pdf "$READTHEDOCS_OUTPUT/pdf/nampy.pdf"

# Python configuration
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

# Sphinx configuration
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

# Build formats
formats:
  - pdf
  - epub
