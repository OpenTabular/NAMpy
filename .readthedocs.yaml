# Read the Docs configuration file for NAMpy.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

# Build documentation in the docs/ directory
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - pandoc
    - libcairo2
  jobs:
    post_create_environment:
      - pip install --upgrade pip setuptools wheel
    install:
      # Match CI and avoid downloading CUDA libraries for documentation builds.
      - python -m pip install -c .github/constraints-ci.txt -r .github/requirements-ci-cpu-torch.txt
      - python -m pip install -c .github/constraints-ci.txt ".[docs]"

# Sphinx configuration
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

# Compile the full PDF in GitHub Actions to stay within the RTD time limit.
formats:
  - epub
